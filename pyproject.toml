[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "spectral-studio-wrapper"
version = "0.1.0"
requires-python = "~=3.13"
dependencies = ["PySide6>=6.9,<6.10", "numpy>=2.4,<2.5", "tifffile", "spektrafilm==0.3.4"]
[project.scripts]
spectral-studio = "spectral_studio.desktop:main"
[tool.setuptools.packages.find]
where = ["src"]
